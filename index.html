<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DND Town Builder</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="app">
        <header class="top-title">
            <h1 class="title-bubble">Dnd Town Builder</h1>
        </header>
        <main class="container">
            <aside id="sidebar" style="display:none"></aside>
            <section id="map-area">
                <canvas id="map-canvas"></canvas>
            </section>
        </main>
        <footer id="footer"></footer>

        <!-- Floating Bottom Menu -->
        <div id="bottom-menu" class="bottom-menu">
            <div class="menu-left">
                <button id="undo-btn" class="menu-btn" title="Undo (Ctrl+Z)">↶</button>
                <button id="redo-btn" class="menu-btn" title="Redo (Ctrl+Y)">↷</button>
            </div>
            <div class="menu-center">
                <div id="texture-categories" class="texture-categories"></div>
                <div id="texture-variants-panel" class="floating-texture-panel hidden"></div>
                <button id="paint-btn" class="menu-btn" title="Paint Tool">🖌</button>
                <button id="rect-btn" class="menu-btn" title="Rectangle Tool">▭</button>
                <button id="pan-btn" class="menu-btn" title="Pan Tool">✋</button>
            </div>
            <div class="menu-right">
                <button id="buildings-btn" class="menu-btn" title="Buildings">🏠</button>
                <button id="entities-btn" class="menu-btn" title="Entities">👥</button>
                <button id="export-btn" class="menu-btn" title="Export">💾</button>
            </div>
        </div>

        <!-- Floating Panels -->
        <div id="buildings-panel" class="floating-panel hidden"></div>
        <div id="entities-panel" class="floating-panel hidden"></div>
        <div id="export-panel" class="floating-panel hidden"></div>
    </div>

    <script type="module" src="src/main.js"></script>
</body>

</html>
